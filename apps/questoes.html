<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-SORT - Questões</title>
    <link rel="stylesheet" href="qstyle.css">
</head>
<body>
    <main class="quiz-card">
       
        <header class="quiz-header">
            <div class="quiz-info">
                <span class="step-indicator">Pergunta <strong id="current-step">1</strong> de 5</span>
                <span class="category-badge">Eletrônicos</span>
            </div>
         
            <div class="progress-bar">
                <div class="progress-fill" style="width: 20%;"></div>
            </div>
        </header>


        <section class="question-body">
            <h2>Onde devem ser descartadas pilhas e baterias usadas em Olinda?</h2>
            
 
            <div class="options-container">
                <label class="option-card">
                    <input type="radio" name="resposta" value="a">
                    <span class="custom-radio">A</span>
                    <span class="option-text">No lixo comum do dia a dia</span>
                </label>

                <label class="option-card">
                    <input type="radio" name="resposta" value="b">
                    <span class="custom-radio">B</span>
                    <span class="option-text">Em pontos de coleta específicos (PEVs) e supermercados parceiros</span>
                </label>

                <label class="option-card">
                    <input type="radio" name="resposta" value="c">
                    <span class="custom-radio">C</span>
                    <span class="option-text">Junto com o lixo reciclável de papel e plástico</span>
                </label>

                <label class="option-card">
                    <input type="radio" name="resposta" value="d">
                    <span class="custom-radio">D</span>
                    <span class="option-text">Enterradas no quintal ou em áreas verdes</span>
                </label>
            </div>
        </section>

  
        <footer class="quiz-footer">
            <a href="index.html" class="btn-secondary">⮪ Sair</a>
            <button type="button" class="btn-primary">Próxima ➔</button>
        </footer>
    </main>
</body>
</html>
